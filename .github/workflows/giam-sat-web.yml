# Giám sát web thật (SEO mục 13): mỗi 6 giờ chạy `seo:security` với https://www.caycanhmientay.com.
# Báo lỗi (GitHub gửi email cho người sửa lịch chạy gần nhất) khi: web không trả lời / trả 5xx, Googlebot bị chặn,
# chứng chỉ TLS hỏng hoặc còn < 14 ngày, DNS lỗi, http không chuyển sang https, mất header bảo mật, robots.txt chặn cả web,
# sitemap mất > 20% trang hoặc canonical đổi so với lần chạy trước, lộ dữ liệu riêng tư trong HTML; URL quan trọng trong
# web/seo/url-quan-trong.txt mất trang / chuyển hướng sai (seo:migration).
# Chạy tay: tab Actions → "Giám sát web" → Run workflow. Không cần secret.
name: Giám sát web

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giam-sat-web
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mốc lần chạy trước (robots.txt, danh sách trang sitemap, canonical) — so để bắt thay đổi bất thường.
      - name: Lấy mốc lần trước
        uses: actions/cache/restore@v4
        with:
          path: web/.seo-baseline.json
          key: seo-baseline-${{ github.run_id }}
          restore-keys: seo-baseline-
      # Script chỉ dùng thư viện có sẵn của Node nên không cần npm ci.
      - name: Kiểm tra bảo mật / HTTPS / ổn định
        env:
          SECURITY_BASELINE: .seo-baseline.json
        run: npx --yes tsx@4.23.15 scripts/check-security.mts https://www.caycanhmientay.com
      - name: Lưu mốc mới
        if: success()
        uses: actions/cache/save@v4
        with:
          path: web/.seo-baseline.json
          key: seo-baseline-${{ github.run_id }}
      # URL quan trọng (seo/url-quan-trong.txt): còn mở được / chuyển hướng 308 đúng một bước (mục 16 checklist SEO).
      - name: Kiểm URL quan trọng
        if: success() || failure()
        run: npx --yes tsx@4.23.15 scripts/check-migration.mts https://www.caycanhmientay.com seo/url-quan-trong.txt
      # Giám sát SEO (mục 19): trang sitemap lỗi / chuyển hướng / noindex / canonical lệch / mồ côi, thời gian phản hồi,
      # 404 mới, lỗi máy chủ, Googlebot thật. Phần số liệu máy chủ cần secret SEO_MONITOR_TOKEN (= biến cùng tên trên Vercel).
      - name: Lấy mốc giám sát SEO
        if: success() || failure()
        uses: actions/cache/restore@v4
        with:
          path: web/.seo-monitor.json
          key: seo-monitor-${{ github.run_id }}
          restore-keys: seo-monitor-
      - name: Giám sát SEO (log, 404, lỗi máy chủ)
        id: monitor
        if: success() || failure()
        env:
          SEO_MONITOR_TOKEN: ${{ secrets.SEO_MONITOR_TOKEN }}
          MONITOR_BASELINE: .seo-monitor.json
        run: npx --yes tsx@4.23.15 scripts/check-monitor.mts https://www.caycanhmientay.com
      - name: Lưu mốc giám sát SEO
        if: steps.monitor.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: web/.seo-monitor.json
          key: seo-monitor-${{ github.run_id }}
