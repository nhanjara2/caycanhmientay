<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ProfileForm</title></head>
<body>
<div class="vx-pad"><section class="vx-profile"><div class="vx-profile__head">Thông tin cá nhân</div><div class="vx-profile__body">
<div class="vx-profile__av"><span class="vx-avatar">LN</span><button><svg class="vx-ico" viewBox="0 0 24 24" ><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div>
<div class="vx-fl"><label>Họ và tên</label><input value="Lê Hoài Nhân"></div>
<div class="vx-fl vx-fl--locked"><label>Số điện thoại</label><input value="0703 005 001" disabled><span class="vx-fl__action">Đổi số</span></div>
<div class="vx-fl"><label>Email (không bắt buộc)</label><input placeholder="Nhận hóa đơn và mẹo chăm cây"></div>
<div style="display:flex;flex-direction:column;gap:8px"><span class="vx-spec">Giới tính</span><div class="vx-radios"><label><span class="vx-radio on"></span>Nam</label><label><span class="vx-radio"></span>Nữ</label><label><span class="vx-radio"></span>Khác</label></div></div>
<div class="vx-fl"><label>Ngày sinh</label><input value="14/06/1996"><span class="vx-fl__action" style="color:var(--ink-muted)"><svg class="vx-ico" viewBox="0 0 24 24" style="width:18px;height:18px"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span></div>
<div style="display:flex;flex-direction:column;gap:8px"><span class="vx-spec">Bạn quan tâm (để nhận gợi ý phù hợp)</span><div class="vx-interest"><button class="vx-chip" aria-pressed="true">Kiểng lá</button><button class="vx-chip" aria-pressed="true">Sen đá</button><button class="vx-chip">Lan</button><button class="vx-chip">Bonsai</button><button class="vx-chip" aria-pressed="true">Rau sạch</button><button class="vx-chip">Cây ăn quả</button><button class="vx-chip">Sân vườn</button></div></div>
<div class="vx-label-row"><span>Nhận nhắc lịch chăm cây qua Zalo</span><button class="vx-switch" aria-checked="true"></button></div>
<button class="vx-btn vx-btn--primary vx-btn--lg" style="align-self:center">Cập nhật thông tin</button></div></section></div>
</body>
</html>
