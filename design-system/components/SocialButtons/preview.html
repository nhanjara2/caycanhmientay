<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>SocialButtons</title></head>
<body>
<div class="vx-pad" style="display:flex;flex-direction:column;gap:16px;background:var(--surface)"><div style="max-width:360px;display:flex;flex-direction:column;gap:10px"><div class="au-social"><button class="au-sbtn"><span class="logo">G</span>Tiếp tục với Google</button><button class="au-sbtn"><span class="logo">Zalo</span>Tiếp tục với Zalo</button><button class="au-sbtn dark"><span class="logo"></span>Tiếp tục với Apple</button></div></div>

</html>
