<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>MapPicker</title></head>
<body>
<div class="vx-scrim"><div class="vx-modal"><div class="vx-modal__head">Chọn vị trí nhận hàng<button aria-label="Đóng"><svg class="vx-ico" viewBox="0 0 24 24" ><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="vx-map"><svg class="bg" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid slice"><rect class="blk" x="20" y="30" width="120" height="80" rx="6"/><rect class="blk" x="160" y="30" width="90" height="80" rx="6"/><rect class="blk" x="20" y="200" width="150" height="90" rx="6"/><rect class="park" x="330" y="30" width="110" height="90" rx="10"/><rect class="blk" x="330" y="200" width="100" height="90" rx="6"/><path class="water" d="M470 320 C 500 240 560 230 600 180 L600 320 Z"/><path class="road" stroke-width="10" d="M0 160 H600"/><path class="road" stroke-width="10" d="M300 0 V320"/><path class="road" stroke-width="6" d="M0 120 H280 M150 0 V320 M320 250 H600"/><path class="major" stroke-width="12" d="M520 0 C 510 120 480 200 470 320"/></svg><div class="vx-map__search"><div class="vx-input"><svg class="vx-ico" viewBox="0 0 24 24" style="width:18px;height:18px;color:var(--ink-muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="ph">Tìm tên đường, tòa nhà…</span></div></div><div class="vx-map__pin"><span><i></i></span></div><span class="vx-map__tip">Kéo bản đồ để đặt ghim đúng cổng nhà</span><button class="vx-map__me" aria-label="Vị trí của tôi"><svg class="vx-ico" viewBox="0 0 24 24" ><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
<div class="vx-sel"><svg class="vx-ico" viewBox="0 0 24 24" ><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span><b>169 Phạm Hữu Lầu</b><small>Phường Tân Mỹ, TP. Hồ Chí Minh</small></span></div>
<div class="vx-zone"><svg class="vx-ico" viewBox="0 0 24 24" ><path d="m5 12 5 5 9-10"/></svg><span>Trong vùng giao <b>cây sống</b> nội thành · dự kiến giao trong ngày</span></div>
<div class="vx-modal__foot"><button class="vx-btn vx-btn--primary vx-btn--lg vx-btn--block">Chọn địa chỉ này</button></div></div></div>
</body>
</html>
